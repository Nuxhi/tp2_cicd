name: CI

# Lance tous les contrôles à chaque push sur main/dev et à chaque PR vers main/dev.
# Traite R2 (tests jamais lancés) et R4 (code non vérifié en prod).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  docker:
    name: Build image + démarrage de la stack
    runs-on: ubuntu-latest
    needs: tests
    env:
      # Valeurs factices, réservées à la CI : aucun vrai secret ici (R1).
      POSTGRES_PASSWORD: ci-mot-de-passe-factice
      POSTGRES_DB: shop
    steps:
      - uses: actions/checkout@v4

      # Build de l'image sans la pousser.
      - name: Build de l'image
        run: docker build -t tp2-api:ci .

      # Démarre db + api : vérifie init.sql, le healthcheck de la base et l'API.
      - name: Démarrage de la stack
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: Smoke test (/health et /products)
        run: |
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/products

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêt de la stack
        if: always()
        run: docker compose down -v
